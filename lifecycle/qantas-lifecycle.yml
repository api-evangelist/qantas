generated: '2026-07-28'
method: searched
source: Qantas Agency Connect distribution documentation and dated agency news
note: |
  Qantas publishes no API versioning policy, no deprecation policy, no SLA and no
  status page for the Qantas Distribution Platform. What it does publish is a
  channel-level lifecycle: a dated, priced migration off legacy EDIFACT onto its own
  NDC platform, announced through a dated agency news feed and a versioned capability
  matrix. That is the real lifecycle signal for this provider, and it is commercial
  rather than technical.
