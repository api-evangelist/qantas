    url: https://www.qantas.com/adobe/assets/urn:aaid:aem:00230b0b-8c1e-4da6-8261-787185e22a1b/original/as/qdp-capability-listing-tool.pdf
    version: '5.3'
    updated: '2026-07-10'
    note: The only versioned, dated Qantas document describing the NDC surface. It
      versions the capability matrix, not the interface.
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: unknown
  evidence: |
    No API deprecation policy exists. Two adjacent published commitments are the
    closest analogues, and neither is an interface deprecation policy:
      - Standard Agency Terms and Conditions 1.3: "Qantas may amend these Terms and
        any related Qantas policies or procedures by posting updates on the Qantas
        Agency Connect Site with such changes taking effect on 30 days' notice or
        earlier if required by law or for operational reasons."
      - Distribution Surcharge Policy: Qantas "will provide notice of any such
        changes on the Qantas Agency Connect website."
  channel_deprecation:
    target: Legacy GDS EDIFACT
    mechanism: price, not protocol
    detail: |
      From 1 July 2025 every Qantas-marketed segment ticketed through EDIFACT carries
      a per-segment distribution surcharge (AUD11.50 POS AU / NZD17.50 POS NZ /
      USD13.00 POS ROW), rising to AUD12.00 / NZD18.00 / USD13.50 on 29 July 2026,
      while NDC through a Certified Technology Partner, the QDP portal, or Premium
      NDC is exempt. Qantas is retiring the legacy channel commercially without ever
      announcing an EDIFACT end-of-life date.
    sources:
    - https://agencyconnect.qantas.com/en-au/policies/fares-and-ticketing/distribution-surcharge-policy
    - https://agencyconnect.qantas.com/en-au/news/july-2026/distribution-changes
