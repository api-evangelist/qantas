note: |
  Qantas publishes no API changelog and no release notes — there is no versioned
  interface to release against. The functioning substitute is Agency News on Qantas
  Agency Connect: a dated, categorised feed that carries distribution-platform and
  NDC change notices alongside fare and network news. Two categories are
  distribution-relevant — qac:category/qantas-distribution-platform and
  qac:category/qantas-ndc. Entries below are the distribution/NDC-relevant items
  from the recent window, captured verbatim from the published pages; the feed is
  the source of truth and is not mirrored in full here.
