surcharge_exceptions:
- Tickets issued through Qantas direct booking channels
- Tickets issued via the Qantas Distribution Platform portal (QDPp)
- Tickets issued via Premium NDC, or via Standard NDC through a non-GDS technology
  partner
- Group bookings quoted, booked and ticketed using the Qantas Group Travel website
- Specific routes including the Qantas and Emirates joint-business routes between
  Australia and New Zealand, and between Australia/New Zealand and the UK, Europe,
  North Africa, the Middle East, Thailand and Singapore
change_policy: Qantas reserves the right to review the terms, conditions and amount
  of the Qantas Distribution Surcharge from time to time, and will provide notice of
  any such changes on the Qantas Agency Connect website.
