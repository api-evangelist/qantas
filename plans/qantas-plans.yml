note: 'Qantas does not sell API access; it prices DISTRIBUTION CHANNELS. There is no

  subscription, no metered API pricing and no free tier. What is published is a

  per-segment Qantas Distribution Surcharge collected as a YR fee at ticket issue,

  which varies by the channel the booking was made through. The effect is a price

  ladder that makes the legacy GDS/EDIFACT channel the most expensive and Qantas''

  own NDC platform free — pricing, not protocol, is the migration lever. Access to

  the cheapest tier (Premium NDC) is invitation/criteria based, not purchasable.


  2026-10-20 re-check: agencyconnect.qantas.com timed out from this pipeline (HTTP status none, plain and headless

  browser), so the surcharge table was re-read from the Wayback Machine 2026 capture in archived_copy. That

  capture shows the amounts announced on 21 July 2026 now in force (EDIFACT AUD12.00 / NZD18.00 / USD13.50;

  Standard NDC via GDS AUD4.70 / NZD5.50 / USD4.00; Standard NDC and Premium NDC ''Exempt''). price_text values

  are copied verbatim from that capture; the live page could not be fetched to re-verify them today.

