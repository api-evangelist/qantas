actions:
  openapiHarvested: false
  openapiDirectoryCreated: false
  reason: |
    No machine-readable API definition of any kind is published by Qantas. Every
    spec path probed on qantas.com, api.qantas.com and agencyconnect.qantas.com
    returned HTTP 404, no developer subdomain resolves, there is no Qantas GitHub
    organization, and Qantas is not on the IATA Developer Portal. The NDC XML API
    contract is disclosed only after a Qantas Distribution Platform Access
    Agreement is signed. Nothing was fabricated and no openapi/ directory was
    created.
  apisYmlCreated: true
  apisListed: 1
