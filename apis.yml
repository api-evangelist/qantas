name: Qantas
kind: company
humanURL: https://www.qantas.com/
description: Qantas Airways Limited is Australia's flag carrier and, with its low-cost
  subsidiary Jetstar, one half of a domestic duopoly alongside Virgin Australia. In
  the distribution chain Qantas is the supplier of its own inventory — it sits upstream
  of the GDSs (Amadeus, Sabre, Travelport), the aggregators (Duffel, Travelfusion,
  Mystifly, Verteil, AirGateway, TPConnects, TravelSky) and the large Australian agency
  groups (Flight Centre, Corporate Travel Management, Webjet). Its API posture is
  distribution-only and fully gated. Qantas publishes no developer portal, no OpenAPI
  or Swagger definition, and no public consumer API; developer., developers., docs.
  and api.qantas.com.au do not resolve, and api.qantas.com returns 404 on every path
  probed. The one real API is the Qantas Distribution Platform (QDP) NDC XML API,
  built with Farelogix (now Accelya) and certified by IATA to NDC@Scale. It is documented
  in prose on Qantas Agency Connect but no endpoint, schema or specification is published;
  a technology partner must sign a Qantas Distribution Platform Access Agreement,
  subject to Qantas technical and commercial approval, before it is granted test-environment
  access, and an agency must hold IATA, ARC, TIDS or VTC accreditation. Public docs
  on how to get in, no public contract and no exit path.
