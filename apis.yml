apis:
- aid: qantas:qantas-distribution-platform-ndc-xml-api
  name: Qantas Distribution Platform NDC XML API
  description: The Qantas Distribution Platform (QDP) is Qantas' NDC XML API for airline retailing
    — shopping, offer and order creation, ticketing, ancillaries and post-booking servicing
    of Qantas (QF) content for travel agencies, GDSs and aggregators. Built in partnership
    with Farelogix Inc. (now Accelya) on IATA's New Distribution Capability standard, and
    certified by IATA to NDC@Scale. Qantas states the platform "does not have a customer-facing
    user interface" and is "designed to allow Technology Partners to develop a connection
    to our NDC XML API". No endpoint host, no NDC schema version and no machine-readable specification
    are published; access requires a signed Qantas Distribution Platform Access Agreement,
    and agencies must hold IATA, ARC, TIDS or VTC accreditation. Agencies that cannot connect
    through a Certified Technology Partner may instead use the QDP portal, a web UI powered
    by Accelya NDC SPRK.
  humanURL: https://agencyconnect.qantas.com/en-au/ndc
